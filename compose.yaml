services:
  subtitle-app:
    build: .
    restart: unless-stopped
    environment:
      WHISPER_CPU_THREADS: "2"
      LOCAL_TRANSLATION_MODEL: /data/models/nllb-600m
      GRADIO_ANALYTICS_ENABLED: "False"
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - whisper-models:/data/models
      - subtitle-outputs:/app/outputs
    mem_limit: 3g
    cpus: 2.0

volumes:
  whisper-models:
  subtitle-outputs:
